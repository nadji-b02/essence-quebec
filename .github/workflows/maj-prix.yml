name: Mise à jour des prix

# GitHub lance les tâches programmées seulement toutes les 60 à 90 minutes environ, à des heures irrégulières.
# Chaque lancement fait donc une série de mises à jour toutes les 10 minutes (à 1 min 30 après chaque
# fichier de la Régie) pendant environ 2 heures. Le lancement suivant attend son tour et prend le relais
# dès que la série se termine : il n'y a pas de trou entre deux lancements.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      tours:
        description: "Nombre de mises à jour (1 à 12)"
        default: "12"
      cadence:
        description: "Minutes entre les mises à jour"
        default: "10"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Une nouvelle version de l'appli (push) interrompt la série en cours pour être publiée tout de suite,
# puis continue elle-même la série complète.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  TOURS: ${{ inputs.tours || '12' }}
  CADENCE: ${{ inputs.cadence || '10' }}

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.dep1.outputs.page_url || steps.dep1b.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - uses: actions/configure-pages@v5

      # En cas d'erreur réseau de GitHub : le paquet est renvoyé sous un autre nom après 45 s,
      # et la publication est réessayée après 60 s. Une erreur n'arrête pas les mises à jour suivantes.
      # Mise à jour 1
      - name: Prix 1
        run: bash scripts/tour.sh
      - name: Paquet 1
        id: pk1
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-1 }
      - name: Attente paquet 1
        if: steps.pk1.outcome == 'failure'
        run: sleep 45
      - name: Paquet 1 (nouvel essai)
        id: pk1b
        if: steps.pk1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-1b }
      - name: Publication 1
        id: dep1
        if: (steps.pk1.outcome == 'success' || steps.pk1b.outcome == 'success')
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { artifact_name: "${{ steps.pk1.outcome == 'success' && 'pages-1' || 'pages-1b' }}" }
      - name: Attente 1
        if: steps.dep1.outcome == 'failure'
        run: sleep 60
      - name: Nouvel essai 1
        id: dep1b
        if: steps.dep1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { artifact_name: "${{ steps.pk1.outcome == 'success' && 'pages-1' || 'pages-1b' }}" }
      # Mise à jour 2
      - name: Prix 2
        if: fromJSON(env.TOURS) >= 2
        run: bash scripts/attendre.sh && bash scripts/tour.sh
      - name: Paquet 2
        id: pk2
        if: fromJSON(env.TOURS) >= 2
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-2 }
      - name: Attente paquet 2
        if: fromJSON(env.TOURS) >= 2 && steps.pk2.outcome == 'failure'
        run: sleep 45
      - name: Paquet 2 (nouvel essai)
        id: pk2b
        if: fromJSON(env.TOURS) >= 2 && steps.pk2.outcome == 'failure'
